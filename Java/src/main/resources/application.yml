# 服务基础配置：指定端口与日志级别
server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: reusebook-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
logging:
  level:
    root: info
    com.reusebook: debug

reusebook:
  storage:
    image-dir: ${REUSEBOOK_IMAGE_DIR:uploads}
    public-url-prefix: /uploads/
